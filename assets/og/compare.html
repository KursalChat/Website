<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 400;
        src: url("../../static/fonts/ibm-plex-mono-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 600;
        src: url("../../static/fonts/ibm-plex-mono-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 700;
        src: url("../../static/fonts/ibm-plex-mono-700.woff2") format("woff2");
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 1200px;
        height: 630px;
      }

      body {
        background: transparent;
        font-family: "IBM Plex Mono", monospace;
      }

      .window {
        width: 100%;
        height: 100%;
        display: flex;
        flex-direction: column;
        border: 1px solid #2b3445;
        border-radius: 12px;
        background: #0b0e14;
        overflow: hidden;
      }

      .titlebar {
        display: flex;
        align-items: center;
        justify-content: space-between;
        padding: 18px 30px;
        background: #121723;
        border-bottom: 1px solid #1d2433;
        font-size: 21px;
      }

      .dots {
        display: flex;
        gap: 10px;
      }

      .dots span {
        width: 16px;
        height: 16px;
        border-radius: 50%;
      }

      .dots span:nth-child(1) {
        background: #ff5f57;
      }

      .dots span:nth-child(2) {
        background: #febc2e;
      }

      .dots span:nth-child(3) {
        background: #28c840;
      }

      .titlebar .url {
        color: #687891;
      }

      .body {
        flex: 1;
        display: flex;
        flex-direction: column;
        justify-content: center;
        padding: 44px 56px 46px;
      }

      .kicker {
        font-size: 22px;
        color: #79a8ff;
        margin-bottom: 14px;
      }

      h1 {
        font-size: 46px;
        font-weight: 700;
        color: #eef3fa;
        letter-spacing: -0.02em;
        line-height: 1.15;
        margin-bottom: 34px;
      }

      .rows {
        display: flex;
        flex-direction: column;
        gap: 16px;
      }

      .row {
        display: flex;
        align-items: center;
        gap: 24px;
      }

      .name {
        width: 168px;
        flex-shrink: 0;
        font-size: 25px;
        color: #93a1ba;
      }

      .row.us .name {
        font-weight: 600;
        color: #eef3fa;
      }

      .track {
        flex: 1;
        height: 44px;
        border: 1px solid #1d2433;
        border-radius: 3px;
        background: #06080c;
        padding: 4px;
      }

      .fill {
        display: block;
        height: 100%;
        border-radius: 2px;
        background: #2b3445;
      }

      .row.us .fill {
        background: #4d8dff;
      }

      .value {
        width: 148px;
        flex-shrink: 0;
        text-align: right;
        font-size: 25px;
        color: #93a1ba;
      }

      .row.us .value {
        font-weight: 600;
        color: #eef3fa;
      }

      .foot {
        display: flex;
        align-items: baseline;
        gap: 12px;
        margin-top: 34px;
        border-top: 1px solid #1d2433;
        padding-top: 24px;
        font-size: 21px;
        color: #78859c;
      }

      .foot .arrow {
        color: #4d8dff;
      }

      .foot b {
        font-weight: 600;
        color: #79a8ff;
      }
    </style>
  </head>
  <body>
    <div class="window">
      <div class="titlebar">
        <span class="dots"><span></span><span></span><span></span></span>
        <span class="url">kursal.chat/compare</span>
      </div>
      <div class="body">
        <p class="kicker">~/benchmarks</p>
        <h1>Lighter than everything it replaces.</h1>

        <div class="rows">
          <div class="row us">
            <span class="name">Kursal</span>
            <span class="track"
              ><span class="fill" style="width: 14.3%"></span
            ></span>
            <span class="value">106 MB</span>
          </div>
          <div class="row">
            <span class="name">WhatsApp</span>
            <span class="track"
              ><span class="fill" style="width: 51.5%"></span
            ></span>
            <span class="value">380 MB</span>
          </div>
          <div class="row">
            <span class="name">Signal</span>
            <span class="track"
              ><span class="fill" style="width: 81.9%"></span
            ></span>
            <span class="value">604 MB</span>
          </div>
          <div class="row">
            <span class="name">Discord</span>
            <span class="track"
              ><span class="fill" style="width: 100%"></span
            ></span>
            <span class="value">737 MB</span>
          </div>
        </div>

        <div class="foot">
          <span class="arrow">&#8627;</span>
          <span
            >Idle RAM, measured on macOS, July 2026. Kursal also installs in
            <b>25 MB</b> against 344&ndash;612 MB for the rest.</span
          >
        </div>
      </div>
    </div>
  </body>
</html>
