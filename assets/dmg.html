<!doctype html>
<html>
  <head>
    <meta charset="utf-8" />
    <style>
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 400;
        src: url("../static/fonts/ibm-plex-mono-400.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 600;
        src: url("../static/fonts/ibm-plex-mono-600.woff2") format("woff2");
      }
      @font-face {
        font-family: "IBM Plex Mono";
        font-weight: 700;
        src: url("../static/fonts/ibm-plex-mono-700.woff2") format("woff2");
      }

      * {
        margin: 0;
        box-sizing: border-box;
      }

      html,
      body {
        width: 820px;
        height: 500px;
      }

      body {
        background: linear-gradient(#0b0e14, #06080c);
        font-family: "IBM Plex Mono", monospace;
        -webkit-font-smoothing: antialiased;
        position: relative;
      }

      .content {
        padding: 52px 60px;
      }

      .brand {
        display: flex;
        align-items: center;
        gap: 12px;
        margin-bottom: 18px;
      }

      .brand img {
        width: 40px;
        height: 40px;
      }

      .brand span {
        font-size: 28px;
        font-weight: 700;
        color: #eef3fa;
        letter-spacing: -0.02em;
      }

      .brand span em {
        font-style: normal;
        color: #4d8dff;
      }

      h1 {
        font-size: 40px;
        font-weight: 700;
        color: #eef3fa;
        letter-spacing: -0.02em;
        line-height: 1.2;
        margin-bottom: 14px;
      }

      h1 .chevron {
        color: #687891;
      }

      .caret {
        display: inline-block;
        width: 0.55em;
        height: 0.95em;
        margin-left: 0.1em;
        vertical-align: -0.08em;
        background: #4d8dff;
      }

      .sub {
        font-size: 17px;
        color: #687891;
      }

      .sub .hash {
        color: #3e4a60;
      }

      .zone {
        position: absolute;
        inset: 0;
        pointer-events: none;
      }

      .prompt {
        position: absolute;
        left: 60px;
        bottom: 44px;
        font-size: 22px;
        font-weight: 700;
        color: #4d8dff;
        line-height: 1;
      }

      .prompt .caret {
        margin-left: 0.5em;
      }
    </style>
  </head>
  <body>
    <div class="content">
      <div class="brand">
        <img src="../static/icon.png" />
        <span>kursal<em>:~$</em></span>
      </div>
      <h1>
        <span class="chevron">&gt;</span> drag to install<span class="caret"></span>
      </h1>
      <p class="sub">
        <span class="hash">#</span> no servers &#183; no tracking
      </p>
    </div>
    <svg class="zone" width="820" height="500" viewBox="0 0 820 500">
      <g stroke="#3e4a60" stroke-width="1.75" fill="none" stroke-linecap="square">
        <path d="M145 289 V265 H169" />
        <path d="M251 265 H275 V289" />
        <path d="M145 371 V395 H169" />
        <path d="M251 395 H275 V371" />
      </g>
      <rect x="545" y="265" width="130" height="130" rx="12" fill="none" stroke="#2b3445" stroke-width="1.75" stroke-dasharray="7 7" />
      <line x1="315" y1="330" x2="479" y2="330" stroke="#4d8dff" stroke-width="3" stroke-linecap="square" stroke-dasharray="10 8" />
      <polygon points="479,317 505,330 479,343" fill="#4d8dff" />
    </svg>
    <div class="prompt">&gt;<span class="caret"></span></div>
  </body>
</html>
